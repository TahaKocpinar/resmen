[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resmen"
version = "0.1.0"
description = "Türkiye'de hayat olayları için kaynaklı rehber: her cümle resmî metinden birebir alıntıya bağlı, alıntılar her hafta mevzuat.gov.tr'ye karşı denetlenir."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
resmen = "resmen.cli:main"

[tool.setuptools]
packages = ["resmen"]
